name: Job Radar

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh career page discovery
        if: github.event.schedule == '30 5 * * 0' || github.event_name == 'workflow_dispatch'
        run: python run.py --rediscover --digest
        continue-on-error: true
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}

      - name: Run the radar
        run: python run.py --digest
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}

      - name: Save results
        run: |
          git config user.name  "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          mkdir -p data docs
          git add -A data docs
          if git diff --staged --quiet; then
            echo "nothing new to save"
            exit 0
          fi
          git commit -m "radar: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME" \
              && git rebase "origin/$GITHUB_REF_NAME" \
              && git push && exit 0
            sleep 5
          done
          echo "could not push results"
          exit 1

      - name: Publish the dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Email me the new openings
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(head -1 digest.md | grep -oE '^[0-9]+' || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            gh issue create \
              --title "Job Radar: $COUNT new openings, $(date -u +%d\ %b)" \
              --body-file digest.md
          fi

  deploy:
    needs: radar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

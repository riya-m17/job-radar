  - name: NIH Postbaccalaureate IRTA
    org: National Institutes of Health
    cat: institute
    type: post-bac
    status: ineligible
    checked: "2026-08-10"
    opens: 1
    closes: 12
    effort: 0
    url: https://www.training.nih.gov/programs/postbac_irta
    eligibility: >
      Requires US citizenship or permanent residence. You are not eligible.
    note: >
      An earlier version of this calendar claimed the opposite and ranked this
      first. That was wrong. For the record, the programme is genuinely
      rolling with no deadline, and recommends applying six to nine months
      before a start date, with most postbacs beginning in June or July. None
      of which helps here. The same citizenship bar applies to most NSF REU
      sites and to AAAS Science and Technology Policy Fellowships.

  - name: WHOI Summer Student Fellowship
    org: Woods Hole Oceanographic Institution
    cat: marine
    type: fellowship
    status: ineligible
    checked: "2026-08-10"
    opens: 11
    closes: 2
    deadline: "2027-02-05"
    effort: 0
    url: https://www.whoi.edu/what-we-do/educate/undergraduate-programs/summer-student-fellowship/
    eligibility: >
      International students may apply, so the visa side is fine. The blocker
      is timing: fellowships go to undergraduates who will have completed
      their junior year by the fellowship start, and students who will have
      earned their bachelor's degree before the fellowship begins are
      explicitly not eligible. It is designed for the final undergraduate
      summer. Yours is summer 2026, now, in Copenhagen. By summer 2027 you
      will have graduated.
    note: >
      I called this the single best fit on the list. It is not a fit at all.
      The deadline is 5 February. Worth knowing the same graduation-timing
      rule quietly rules out a lot of undergraduate summer research
      programmes for anyone in your position, which is why the emphasis has
      moved to post-bacs. WHOI itself is still worth approaching directly for
      post-graduation technician and assistant roles, and the acoustics and
      marine mammal groups there remain the right people to know.

  - name: Trinity Life Sciences Associate Consultant
    org: Trinity Life Sciences
    cat: consulting
    type: full time
    status: ineligible
    checked: "2026-08-10"
    opens: 8
    closes: 10
    effort: 0
    url: https://trinitylifesciences.com/company/careers/early-talent/
    eligibility: >
      Blocked outright. Their postings state they cannot consider candidates
      requiring sponsorship "including but not limited to TN, H1-B, F-1, and
      STEM OPT". That names F-1 and STEM OPT specifically, so this is not the
      ambiguous "we do not sponsor" language that can usually be ignored.
    note: >
      Associate Consultant is the correct undergraduate title and the
      internship application closes in early October for a June start, but
      none of that matters given the visa language. Read this as a warning
      about the sector: life science consulting is markedly less open to F-1
      candidates than its recruiting volume suggests. ZS is the firm most
      often reported to sponsor, though reportedly not on the strategy and
      insights team, so ask before investing case practice time.


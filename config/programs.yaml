# The deadline calendar, rebuilt 10 August 2026.
#
# WHAT WENT WRONG THE FIRST TIME
# The first version of this file was written from general knowledge and
# labelled "typical windows". Three of the first three entries checked turned
# out to be wrong in ways that mattered, including the one sitting at the top
# of the priority panel, which requires US citizenship. So every entry now
# carries a status and a checked date, and nothing presents as fact unless it
# was read off the programme's own page.
#
# status values:
#   eligible      verified against the source, and you can apply
#   ineligible    verified, and you cannot. Kept visible on purpose, so the
#                 same dead end is not rediscovered in six months
#   unverified    carried over from the first draft. NOT yet checked. Treat
#                 every date and eligibility claim here as a guess
#
# THE STRUCTURAL POINT THAT KILLS HALF A CALENDAR LIKE THIS
# You graduate May 2027. Summer 2027 is therefore post-graduation, and most
# undergraduate summer programmes require current enrolment through the
# fellowship start. Summer 2026 was your last eligible undergraduate summer
# and it is being spent in Copenhagen. So the things that work are: post-bac
# and early-career programmes that start after graduation, programmes that
# accept recent graduates, autumn full-time recruiting for 2027 starts, and
# anything outside the US.
#
# opens / closes are month numbers, and a window may wrap the new year.
# effort is rough hours to submit something good.

programs:

  # ===================================================================
  # VERIFIED ELIGIBLE. Act on these.
  # ===================================================================

  - name: NYGC Early Career Development Program (Post-Baccalaureate)
    org: New York Genome Center
    cat: institute
    type: post-bac
    status: eligible
    checked: "2026-08-10"
    opens: 8
    closes: 10
    deadline: "2026-10-01"
    effort: 6
    url: https://www.nygenome.org/careers/
    eligibility: >
      Open to B.S. or B.A. holders and to current or rising seniors in a STEM
      field, with the degree awarded before the summer start date and less than
      three years since graduation at the time of applying. No citizenship
      requirement. The posting states it is not eligible for visa sponsorship,
      which does not block you: a two year post-bac sits entirely inside 12
      months of OPT plus the 24 month STEM extension, so nothing needs to be
      sponsored at hire.
    note: >
      The best structural fit on this calendar. Two year full time paid
      position in genomics, computational biology and clinical genetic
      testing, with a summer start. The 2024 cycle closed 1 October, so
      applying by around 1 October 2026 targets a summer 2027 start, which
      lands exactly when you graduate. Confirm the 2026 date on the careers
      page in September. Letters of recommendation can be emailed to
      nygcpostbac@nygenome.org and must arrive by the deadline.

  - name: AAAS Mass Media Science and Engineering Fellowship
    org: AAAS
    cat: media
    # Called a fellowship, but it is a ten week summer placement, so it is
    # typed as an internship and stays out of the jobs panel.
    type: internship
    status: eligible
    checked: "2026-08-10"
    opens: 10
    closes: 1
    deadline: "2027-01-01"
    effort: 10
    url: https://www.aaas.org/fellowships/mass-media/apply
    eligibility: >
      Open to students enrolled as upper level undergraduates, or to anyone
      within one year of completing that degree, so summer 2027 qualifies
      either as a graduating senior or as a recent graduate. Explicitly open
      to international students already studying in the US who hold a visa
      allowing paid summer work. AAAS will not help obtain or retain that
      visa, so post-completion OPT has to be approved in time. Biology
      qualifies; journalism and English majors are excluded.
    note: >
      Ten weeks placed inside a newsroom writing science journalism, stipend
      around 8,000 dollars plus travel. Given The Wild Type, your writing
      samples already exist, which is the part most applicants struggle with.
      Applications opened 1 October and closed 1 January last cycle. The one
      thing to sort early is OPT timing with Haverford's international office,
      since a June start needs the authorisation in hand.

  - name: Smithsonian Internship Program
    org: Smithsonian Institution
    cat: museum
    type: internship
    status: eligible
    checked: "2026-08-10"
    opens: 1
    closes: 12
    effort: 5
    url: https://internships.si.edu/opportunities
    eligibility: >
      International students within the continental US are eligible, and
      eligibility extends to recent graduates up to two years out of school,
      so a post-graduation summer 2027 placement works. International interns
      must hold appropriate visa status, and the Office of International
      Relations verifies it before an appointment is confirmed.
    note: >
      Not one deadline but many, set per museum, so the calendar cannot give a
      single date. Stipends run up to 450 dollars a week part time and 850
      full time. Relevant units are the National Museum of Natural History,
      which posts a science writing internship, the Smithsonian Environmental
      Research Center in Maryland, and the Tropical Research Institute in
      Panama. Applications go through the SOLAA system. There are virtual info
      sessions on 10 and 23 September 2026, which is the cheapest possible way
      to find the real deadlines for the units you want.

  - name: Broad Institute Research Associate I
    org: Broad Institute
    cat: institute
    type: full time
    status: unverified
    opens: 1
    closes: 12
    effort: 4
    url: https://www.broadinstitute.org/careers
    eligibility: >
      UNVERIFIED as policy, but your own outreach tracker records a Research
      Associate I posting that stated it accepts OPT and asked for 24 months
      of it. Cap exempt, so it can file an H-1B outside the lottery later.
    note: >
      A real full time job, not a programme, and the closest thing on this
      calendar to what you actually want. Postings appear year round with a
      cluster from September to March for summer starts. Because it is rolling,
      the Job Radar openings ledger will catch these as they post, which is
      the right division of labour: the calendar handles annual deadlines, the
      ledger handles rolling jobs.


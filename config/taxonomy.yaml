# What counts as relevant, and what gets thrown out.
# Everything here is lowercase substring matching. Edit freely.

categories:
  genomics:      Genomics and sequencing
  biotech:       Biotech and therapeutics
  health_data:   Clinical genomics and health data
  bio_software:  Research software and lab tools
  institute:     Research institutes
  conservation:  Conservation and environment
  marine:        Marine, ocean and aquaria
  bioacoustics:  Bioacoustics and sensing
  museum:        Museums, zoos and collections
  media:         Science media and communication
  climate:       Climate, geospatial and remote sensing
  public_health: Public and global health
  policy:        Science policy and think tanks
  plant_science: Plant and agricultural science
  lab_services:  Instruments, CROs and lab services
  consulting:    Life science consulting
  env_consulting: Environmental and ecological consulting
  aggregator:    Found via a job board rather than an employer page


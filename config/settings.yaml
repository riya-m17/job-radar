# Runtime settings. Safe to edit.

run:
  # Only postings scoring at least this much survive. Lower it to widen the
  # net, raise it if the dashboard gets noisy. 6 is deliberately generous.
  min_relevance: 6

  # Sources that arrive with no structured data, meaning the RSS boards, have
  # to clear a higher bar. They give a title and a link and nothing else, so a
  # weak match from one of them is almost always noise.
  min_relevance_lowtrust: 16

  # Freshness. A posting older than this is dropped outright, because applying
  # to something filled two months ago wastes your time and theirs. Postings
  # whose date cannot be established are kept but flagged, since throwing them
  # away would lose real openings from feeds that simply do not publish a date.
  max_age_days: 75
  # Past this, a posting is shown but marked as ageing.
  stale_after_days: 30
  # Drop rather than merely rank down anything requiring citizenship, a
  # clearance, or permanent work authorisation. You cannot apply to these.
  drop_blocked: true

  # The experience bar. A posting asking for more years than this is dropped,
  # because it will not hire a 2027 graduate however well it matches. The
  # employer stays in the registry, so it is still watched for better roles.
  max_years_experience: 2
  # Bench technician roles in a named professor's lab at a university. Removed.
  # This does not touch non-university research institutes such as the Broad,
  # the New York Genome Center or Woods Hole.
  drop_academic_bench: true
  # Roles requiring a master's. Off by default, since some say master's
  # "or equivalent experience" and are worth a look.
  drop_masters_required: false

  # You want jobs, not internships. Internships and seasonal roles are dropped.
  # Fellowships and post-bacs are NOT internships: a two year paid post-bac at
  # a research institute is a full time job with a programme wrapped round it,
  # and those are among the best routes open to a graduating F-1 student, so
  # they stay. Set this to false if you ever want summer roles back.
  exclude_internships: true
  # A posting is marked closed once it stops appearing for this many runs.
  stale_runs_before_closed: 3
  # Requests
  timeout_seconds: 25
  max_workers: 12
  retries: 2
  user_agent: "job-radar/1.0 (personal job search tool)"

# Places you actually want to be. A posting in one of these gets a scoring
# bonus and a badge on the dashboard, so a good role in San Diego outranks an
# equally good one in Ohio. This changes ranking only, never filtering.
priority_locations:
  west_coast:
    bonus: 10
    markers: ["san diego", "la jolla", "carlsbad", "san francisco", "south san francisco",
              "bay area", "berkeley", "oakland", "emeryville", "palo alto", "menlo park",
              "mountain view", "redwood city", "san jose", "santa cruz", "sunnyvale",
              "seattle", "bellevue", "portland", ", ca", ", wa", ", or",
              "california", "washington state", "oregon"]
  copenhagen:
    bonus: 8
    markers: ["copenhagen", "københavn", "kobenhavn", "denmark", "danmark",
              "lyngby", "hørsholm", "horsholm", "hillerød", "roskilde",
              "aarhus", "odense", "greenland", "nuuk"]
  india:
    bonus: 8
    markers: ["india", "bengaluru", "bangalore", "hyderabad", "mumbai", "pune",
              "delhi", "new delhi", "gurugram", "gurgaon", "noida", "chennai",
              "kolkata", "ahmedabad", "thiruvananthapuram", "kochi", "goa",
              "dehradun", "mysuru", "mysore"]

geography:
  # She said anywhere. These only affect the region label and the F-1 logic,
  # not whether a posting is kept.
  us_markers: [", ca", ", ny", ", ma", ", md", ", wa", ", tx", ", il", ", pa",
               ", nc", ", nj", ", co", ", ga", ", va", ", dc", ", fl", ", mn",
               ", mi", ", oh", ", az", ", or", ", wi", ", ct", ", tn", ", mo",
               ", ut", ", in", ", ak", ", hi", "united states", "usa", "u.s."]
  remote_markers: [remote, "work from home", distributed, anywhere, telework]

sources:
  # Employer career pages. This is the backbone and needs no API keys.
  ats: true
  # Free public job feeds, no keys needed.
  remotive: true
  arbeitnow: true
  himalayas: true
  simplify_newgrad: true
  # Specialist science and conservation boards.
  specialist_boards: true
  # Optional, only run if the matching secret is set in GitHub.
  adzuna: true        # needs ADZUNA_APP_ID and ADZUNA_APP_KEY
  usajobs: true       # needs USAJOBS_KEY and USAJOBS_EMAIL

adzuna:
  countries: [us, gb, de, in, nl, ca, au, sg]
  # India is included in countries below, and these queries are run against
  # every country, so Indian genomics and conservation roles come through here
  # as well as from the employer pages.
  queries:
    - bioinformatics
    - computational biology
    - genomics analyst
    - conservation science
    - wildlife biologist
    - marine biology
    - research assistant biology
    - science communication
    - environmental data analyst
    - biodiversity
    - laboratory technician
    - ecology technician
    - remote sensing ecology
    - genomics research associate
    - project assistant biology
    - junior research fellow
    - clinical genomics analyst
    - wildlife conservation
    - marine conservation
    - science communication

usajobs:
  # Federal roles rarely take F-1 candidates. Kept on because a handful of
  # positions at NOAA, NIH and the Smithsonian are open to non-citizens, and
  # the visa scorer flags the rest as blocked so they sink to the bottom.
  keywords:
    - biological science
    - fishery biologist
    - wildlife biologist
    - bioinformatics
    - ecologist
    - museum specialist
    - physical scientist

output:
  dashboard: docs/index.html
  json_feed: docs/jobs.json
  data_dir: data

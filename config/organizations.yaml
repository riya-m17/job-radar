# Organization registry for Job Radar.
#
# Every entry is an organization whose careers page we try to read directly.
# You do not need to know which system a company uses. The discovery step
# probes Greenhouse, Lever, Ashby, SmartRecruiters, Workable, Recruitee and
# Workday for each one and remembers whichever answers.
#
# Fields:
#   name        display name
#   cat         category key (must exist in taxonomy.yaml -> categories)
#   country     ISO-ish country code, US / UK / DK / DE / INT for international
#   cap_exempt  true for universities, nonprofits and research institutes that
#               are exempt from the H-1B lottery cap. This matters a lot for an
#               F-1 student, so it is scored and shown on the dashboard.
#   hints       optional list of known board slugs to try first
#
# Add or delete lines freely. One entry per organization.

